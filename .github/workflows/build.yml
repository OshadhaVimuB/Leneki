name: build

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: vet and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      # wails build empties frontend/dist, so the go:embed target may be missing.
      - name: Ensure the embed target exists
        run: mkdir -p frontend/dist && touch frontend/dist/gitkeep

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet -tags webkit2_41 ./...
      - name: go test
        run: go test -tags webkit2_41 ./...

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
          - name: darwin-arm64
            os: macos-14
            platform: darwin/arm64
          - name: darwin-amd64
            os: macos-13
            platform: darwin/amd64
          - name: linux-amd64
            os: ubuntu-latest
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails links against the native webview, so each target builds on its own runner.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev+${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        shell: bash
        run: |
          set -e
          FLAGS="-X main.Version=${{ steps.version.outputs.value }}"
          case "${{ runner.os }}" in
            Windows) wails build -platform ${{ matrix.platform }} -nsis -ldflags "$FLAGS" ;;
            Linux)   wails build -platform ${{ matrix.platform }} -tags webkit2_41 -ldflags "$FLAGS" ;;
            macOS)   wails build -platform ${{ matrix.platform }} -ldflags "$FLAGS" ;;
          esac

      - name: Package macOS disk image
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname Leneki \
            -srcfolder build/bin/Leneki.app \
            -ov -format UDZO \
            "build/bin/Leneki-${{ matrix.name }}.dmg"

      # AppImage tooling needs FUSE, which the runners do not provide, so extract and run instead.
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -e
          mkdir -p appimage/AppDir/usr/bin
          cp build/bin/Leneki appimage/AppDir/usr/bin/Leneki
          cp build/linux/leneki.desktop appimage/AppDir/leneki.desktop
          cp build/linux/leneki.png appimage/AppDir/leneki.png
          cd appimage
          curl -sSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSLO https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/raw/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin gtk \
            --desktop-file AppDir/leneki.desktop \
            --icon-file AppDir/leneki.png \
            --output appimage
          mv Leneki*.AppImage "../build/bin/Leneki-${{ matrix.name }}.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: leneki-${{ matrix.name }}
          if-no-files-found: error
          path: |
            build/bin/*.exe
            build/bin/*.dmg
            build/bin/*.AppImage
